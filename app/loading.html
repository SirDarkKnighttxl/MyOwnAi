<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>TANNIS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a12;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── ICON ── */
    .icon-wrap {
      position: relative;
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-img {
      width: 80px;
      height: 80px;
      border-radius: 18px;
      object-fit: cover;
      position: relative;
      z-index: 2;
      animation: icon-breathe 3s ease-in-out infinite;
    }

    .ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(0,212,170,0.2);
      animation: ring-pulse 3s ease-in-out infinite;
    }
    .ring-1 { width: 100px; height: 100px; animation-delay: 0s; }
    .ring-2 { width: 116px; height: 116px; animation-delay: 0.4s; border-color: rgba(0,212,170,0.09); }

    @keyframes ring-pulse {
      0%, 100% { opacity: 0.4; transform: scale(0.97); }
      50%       { opacity: 1;   transform: scale(1.02); }
    }

    @keyframes icon-breathe {
      0%, 100% { opacity: 0.92; }
      50%       { opacity: 1; }
    }

    /* ── WORDMARK ── */
    .wordmark {
      margin-top: 28px;
      font-size: 11px;
      letter-spacing: 8px;
      color: #00d4aa;
      text-transform: uppercase;
    }

    .tagline {
      margin-top: 6px;
      font-size: 8px;
      letter-spacing: 3px;
      color: rgba(255,255,255,0.27);
      text-transform: uppercase;
    }

    /* ── DIVIDER ── */
    .divider {
      margin-top: 36px;
      width: 1px;
      height: 24px;
      background: linear-gradient(to bottom, transparent, rgba(0,212,170,0.2), transparent);
    }

    /* ── STATUS ── */
    .status-wrap {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .status-text {
      font-size: 10px;
      letter-spacing: 3px;
      color: #00d4aa;
      min-height: 14px;
      text-transform: uppercase;
    }

    .cursor {
      display: inline-block;
      width: 6px;
      height: 10px;
      background: #00d4aa;
      margin-left: 3px;
      vertical-align: middle;
      animation: blink 0.8s step-end infinite;
    }

    /* ── PROGRESS BAR ── */
    .bar-track {
      width: 240px;
      height: 2px;
      background: rgba(255,255,255,0.1);
      position: relative;
    }

    .bar-fill {
      position: absolute;
      top: 0; left: 0;
      height: 100%;
      width: 0%;
      background: #00d4aa;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ── STEP DOTS ── */
    .dots {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      transition: background 0.4s ease;
    }

    .dot.active {
      background: #00d4aa;
    }

    /* ── FOOTER ── */
    .footer {
      position: fixed;
      bottom: 20px;
      font-size: 8px;
      letter-spacing: 3px;
      color: rgba(255,255,255,0.27);
      text-transform: uppercase;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-wrap">
      <div class="ring ring-2"></div>
      <div class="ring ring-1"></div>
      <img class="icon-img" src="tannis_icon_new.png" alt="TANNIS"/>
    </div>

    <div class="wordmark">T.A.N.N.I.S</div>
    <div class="tagline">Titans Artificial Non-Networked Intelligence System</div>

    <div class="divider"></div>

    <div class="status-wrap">
      <div class="status-text" id="status-label">
        Initializing<span class="cursor"></span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" id="bar-fill"></div>
      </div>
      <div class="dots">
        <div class="dot active" id="d0"></div>
        <div class="dot" id="d1"></div>
        <div class="dot" id="d2"></div>
        <div class="dot" id="d3"></div>
        <div class="dot" id="d4"></div>
      </div>
    </div>
  </div>

  <div class="footer">Offline &nbsp;·&nbsp; Local &nbsp;·&nbsp; Private</div>

  <script>
    const label   = document.getElementById('status-label')

    const cursor  = '<span class="cursor"></span>'

    function setStep(pct, text, dot) {
      label.innerHTML  = text + cursor

        d.className = 'dot' + (j <= dot ? ' active' : '')
      })
    }

    const params  = new URLSearchParams(window.location.search)
    const accent  = decodeURIComponent(params.get('accent')   || '#00d5ff')

    const text    = decodeURIComponent(params.get('text')     || '#e0e0e0')
    const font    = decodeURIComponent(params.get('font')     || "'Courier New', monospace")
    const fontSize = params.get('fontSize') || '18'

    document.body.style.background  = bg
    document.body.style.fontFamily  = font
    document.body.style.fontSize    = fontSize + 'px'

    document.querySelectorAll('.wordmark, .status-text').forEach(el => {
  el.style.color = accent
})

document.querySelectorAll('.cursor, .dot.active, .bar-fill').forEach(el => {
  el.style.background = accent
})
    document.querySelectorAll('.ring').forEach(el => {
      el.style.borderColor = accent + '33'
    })
    document.querySelector('.bar-fill').style.background = accent
    document.querySelector('.cursor').style.background   = accent
    document.querySelector('.wordmark').style.color      = accent
    document.querySelector('.status-text').style.color   = accent

  </script>
</body>
</html>
