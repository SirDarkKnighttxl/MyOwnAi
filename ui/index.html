<!doctype html>
<html><head><meta charset="utf-8"><title>NOX</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#0a0a12;--sf:#0d0d1a;--in:#12121f;--ac:#00d4aa;--tx:#e0e0e0;--dm:#ffffff55;--bd:#ffffff12}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.65 ui-monospace,Consolas,monospace;height:100vh;display:flex;flex-direction:column}
header{padding:9px 16px;border-bottom:1px solid var(--bd);display:flex;gap:14px;align-items:center;font-size:12px;position:relative}
#dot{width:8px;height:8px;border-radius:50%;background:#444}
#dot.on{background:var(--ac);box-shadow:0 0 8px var(--ac)}
#role{padding:1px 7px;border:1px solid var(--bd);border-radius:999px;color:#b8c0cc;text-transform:uppercase;letter-spacing:.08em}
#role[data-role="ablit"]{color:#ffb454;border-color:#ffb45455}
#role[data-role="trained"]{color:var(--ac);border-color:#00d4aa55}
#model-select{max-width:310px;background:var(--in);border:1px solid var(--bd);color:var(--tx);padding:3px 24px 3px 7px;border-radius:4px;font:inherit}
#model-select:disabled{opacity:.5}
#sampler-toggle{background:transparent;color:var(--dm);border:1px solid var(--bd);padding:3px 8px;border-radius:4px;font:inherit}
#sampler-panel{position:absolute;z-index:20;top:calc(100% + 7px);right:74px;width:370px;padding:13px;background:#0d0d1af5;border:1px solid #ffffff20;border-radius:7px;box-shadow:0 18px 50px #000b}
#sampler-panel[hidden]{display:none}
#sampler-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
#sampler-grid label{display:flex;flex-direction:column;gap:3px;color:var(--dm);font-size:10px;text-transform:uppercase;letter-spacing:.06em}
#sampler-grid input{width:100%;background:var(--in);border:1px solid var(--bd);color:var(--tx);padding:6px;border-radius:4px;font:12px ui-monospace,Consolas,monospace;outline:none}
#sampler-actions{display:flex;align-items:center;gap:10px;margin-top:11px}
#sampler-save{padding:5px 12px;font-size:11px}
#sampler-note{color:var(--dm);font-size:11px}
#airgap-control{display:flex;align-items:center;cursor:pointer}
#airgap-control input{position:absolute;opacity:0;pointer-events:none}
#airgap-badge{padding:2px 7px;border:1px solid #ffffff20;border-radius:999px;color:var(--dm);letter-spacing:.08em}
#airgap-control input:checked + #airgap-badge{color:#ff6b6b;border-color:#ff6b6b66;background:#ff6b6b10}
#approval-layer{position:fixed;z-index:100;inset:0;display:grid;place-items:center;padding:18px;background:#05050bd9;backdrop-filter:blur(8px)}
#approval-layer[hidden]{display:none}
#approval-modal{width:min(680px,100%);padding:22px;background:#10101d;border:1px solid #ffffff24;border-radius:10px;box-shadow:0 28px 90px #000}
#approval-modal h2{margin-bottom:4px;color:#ffb454;font-size:14px;letter-spacing:.12em}
#approval-modal .approval-label{margin-top:14px;color:var(--dm);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
#approval-command{max-height:230px;overflow:auto;margin-top:5px;padding:12px;background:#05050b;border:1px solid var(--bd);border-radius:6px;color:#f1f1f1;white-space:pre-wrap;word-break:break-word}
#approval-cwd{margin-top:5px;color:#b8c0cc;word-break:break-all}
#approval-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}
#approval-actions button{padding:8px 13px;font-size:11px}
#approval-deny{background:#ff6b6b;color:#140606}
#approval-session{background:#ffb454}
#log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:16px}
.msg{max-width:88%;user-select:text;position:relative}
.u{align-self:flex-end;background:var(--in);padding:9px 12px;border-radius:8px;white-space:pre-wrap}
.a{align-self:flex-start;border-left:2px solid var(--ac);padding-left:13px;width:88%}
.a p{margin:0 0 9px}.a p:last-child{margin:0}
.a h1,.a h2,.a h3{font-size:15px;margin:14px 0 6px;color:var(--ac)}
.a ul{margin:0 0 9px;padding-left:20px}.a li{margin:2px 0}
.a code{background:#ffffff10;padding:1px 5px;border-radius:3px;font-size:13px}
.a pre{background:#00000055;border:1px solid var(--bd);padding:11px;border-radius:6px;overflow-x:auto;margin:9px 0}
.a pre code{background:none;padding:0;font-size:13px;line-height:1.5}
.copy{position:absolute;top:-2px;right:-6px;background:#ffffff10;border:1px solid var(--bd);color:var(--dm);font:11px ui-monospace;padding:2px 7px;border-radius:4px;cursor:pointer;opacity:0;transition:.15s}
.msg:hover .copy{opacity:1}
details{margin:0 0 10px}summary{cursor:pointer;color:var(--dm);font-size:12px}
.think{color:#ffffff44;font-size:13px;white-space:pre-wrap;border-left:1px solid #ffffff22;padding-left:9px;margin:6px 0}
footer{padding:12px;border-top:1px solid var(--bd);display:flex;gap:8px}
textarea{flex:1;background:var(--in);border:1px solid var(--bd);color:var(--tx);padding:10px;border-radius:6px;font:inherit;resize:none;height:64px;outline:none}
textarea:focus{border-color:#ffffff30}
button{background:var(--ac);color:#000;border:0;padding:0 18px;border-radius:6px;font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
a{color:var(--ac)}
@media(max-width:720px){header{gap:7px;padding:8px}#role{display:none}#model-select{max-width:145px}#sampler-panel{right:8px;width:calc(100vw - 16px)}}
</style></head><body>
<header><span id="dot"></span><b>NOX</b><span id="role" data-role="ablit">ablit</span>
<select id="model-select" aria-label="Active model"><option>discovering models</option></select><span id="st">starting</span>
<button id="sampler-toggle" type="button">samplers</button>
<div id="sampler-panel" hidden>
  <div id="sampler-grid">
    <label>temperature<input id="sample-temp" type="number" min="0" max="2" step="0.05"></label>
    <label>top p<input id="sample-top_p" type="number" min="0" max="1" step="0.01"></label>
    <label>top k<input id="sample-top_k" type="number" min="0" max="200" step="1"></label>
    <label>min p<input id="sample-min_p" type="number" min="0" max="1" step="0.01"></label>
    <label>repeat penalty<input id="sample-repeat_penalty" type="number" min="0.1" max="2" step="0.01"></label>
    <label>max tokens<input id="sample-max_tokens" type="number" min="1" max="32768" step="1"></label>
  </div>
  <div id="sampler-actions"><button id="sampler-save" type="button">APPLY</button><span id="sampler-note">live on next run</span></div>
</div>
<label id="airgap-control"><input id="airgap" type="checkbox"><span id="airgap-badge">ONLINE</span></label>
<label style="color:var(--dm)"><input type="checkbox" id="think" checked> think</label>
<span style="margin-left:auto"><a href="#" id="reset">clear</a></span></header>
<div id="approval-layer" hidden>
  <section id="approval-modal" role="dialog" aria-modal="true" aria-labelledby="approval-title">
    <h2 id="approval-title">COMMAND APPROVAL</h2>
    <div class="approval-label">command</div><pre id="approval-command"></pre>
    <div class="approval-label">working directory</div><div id="approval-cwd"></div>
    <div id="approval-actions">
      <button id="approval-deny" type="button">DENY</button>
      <button id="approval-allow" type="button">ALLOW</button>
      <button id="approval-session" type="button">ALLOW FOR SESSION</button>
    </div>
  </section>
</div>
<div id="log"></div>
<footer><textarea id="in" placeholder="Enter to send · Shift+Enter for newline"></textarea><button id="go">RUN</button></footer>
<script>
const log=document.getElementById('log'), inp=document.getElementById('in'),
      go=document.getElementById('go'), dot=document.getElementById('dot'),
      st=document.getElementById('st'), roleBadge=document.getElementById('role'),
      modelSelect=document.getElementById('model-select'),
      samplerToggle=document.getElementById('sampler-toggle'),
      samplerPanel=document.getElementById('sampler-panel'),
      samplerSave=document.getElementById('sampler-save'),
      samplerNote=document.getElementById('sampler-note'),
      airgapBox=document.getElementById('airgap'),
      airgapBadge=document.getElementById('airgap-badge'),
      approvalLayer=document.getElementById('approval-layer'),
      approvalCommand=document.getElementById('approval-command'),
      approvalCwd=document.getElementById('approval-cwd'),
      thinkBox=document.getElementById('think');
let hist=[], busy=false, activeApproval=null, approvalBusy=false;
const samplerKeys=['temp','top_p','top_k','min_p','repeat_penalty','max_tokens'];

const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function md(src){
  const blocks=[];
  let s=src.replace(/```[\w-]*\n?([\s\S]*?)```/g,(m,code)=>{
    blocks.push('<pre><code>'+esc(code)+'</code></pre>'); return '\u0000'+(blocks.length-1)+'\u0000';
  });
  s=esc(s);
  s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/^#{6} (.*)$/gm,'<h3>$1</h3>').replace(/^#{5} (.*)$/gm,'<h3>$1</h3>')
     .replace(/^#{4} (.*)$/gm,'<h3>$1</h3>').replace(/^#{3} (.*)$/gm,'<h3>$1</h3>')
     .replace(/^#{2} (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>');
  s=s.replace(/^[ \t]*[-*] (.*)$/gm,'<li>$1</li>');
  s=s.replace(/(?:^|\n)((?:<li>.*<\/li>\n?)+)/g,(m,list)=>'\n<ul>'+list+'</ul>');
  s=s.replace(/\u0000(\d+)\u0000/g,(m,i)=>blocks[+i]);
  return s.split(/\n{2,}/).map(p=>p.trim()).filter(Boolean).map(p=>/^<(h\d|ul|pre)/.test(p)?p:'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('');
}

function splitThinking(src){
  const end=src.indexOf('</think>');
  if(end===-1) return null;
  const prefix=src.slice(0,end), open=prefix.indexOf('<think>');
  return {
    thinking:prefix.slice(open===-1?0:open+7).trim(),
    answer:src.slice(end+8).trim()
  };
}

async function poll(){
  try{
    const s=await (await fetch('/api/status')).json();
    roleBadge.textContent=s.role||'unknown'; roleBadge.dataset.role=s.role||'unknown';
    airgapBox.checked=!!s.airgap; airgapBadge.textContent=s.airgap?'AIRGAP':'ONLINE';
    dot.className=s.ready?'on':''; st.textContent=s.ready?'ready · '+s.mode:(s.error||'loading');
  }catch(e){ dot.className=''; st.textContent='daemon down'; }
}
setInterval(poll,1500); poll();

async function pollApprovals(){
  try{
    const data=await (await fetch('/api/approvals')).json();
    const pending=data.pending||[];
    const current=activeApproval&&pending.find(item=>item.id===activeApproval.id);
    if(current) return;
    activeApproval=pending[0]||null;
    if(!activeApproval){approvalLayer.hidden=true;return;}
    approvalCommand.textContent=activeApproval.command;
    approvalCwd.textContent=activeApproval.cwd;
    approvalLayer.hidden=false;
  }catch(error){}
}
async function decideApproval(decision){
  if(!activeApproval||approvalBusy) return;
  approvalBusy=true;
  const buttons=approvalLayer.querySelectorAll('button');
  buttons.forEach(button=>button.disabled=true);
  try{
    const response=await fetch('/api/approvals/'+activeApproval.id,{
      method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision})
    });
    if(!response.ok) throw new Error('approval failed');
    activeApproval=null; approvalLayer.hidden=true;
  }catch(error){st.textContent=error.message;}
  buttons.forEach(button=>button.disabled=false);
  approvalBusy=false; await pollApprovals();
}
document.getElementById('approval-deny').onclick=()=>decideApproval('deny');
document.getElementById('approval-allow').onclick=()=>decideApproval('allow');
document.getElementById('approval-session').onclick=()=>decideApproval('allow-session');
setInterval(pollApprovals,400); pollApprovals();

async function refreshModels(){
  const data=await (await fetch('/api/models')).json();
  modelSelect.innerHTML='';
  const unloaded=document.createElement('option');
  unloaded.value=''; unloaded.textContent='unloaded'; modelSelect.appendChild(unloaded);
  for(const model of data.models){
    const option=document.createElement('option');
    option.value=model.path;
    option.textContent=(model.role?'['+model.role.toUpperCase()+'] ':'')+model.name+' · '+model.location;
    option.disabled=!model.loadable;
    option.selected=model.active;
    modelSelect.appendChild(option);
  }
  if(!data.loaded) modelSelect.value='';
}

modelSelect.onchange=async()=>{
  modelSelect.disabled=true; st.textContent=modelSelect.value?'switching model':'unloading model';
  try{
    const body=modelSelect.value?{action:'load',path:modelSelect.value}:{action:'unload'};
    const response=await fetch('/api/models',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!response.ok){const data=await response.json();throw new Error(data.detail||'model switch failed');}
  }catch(error){st.textContent=error.message;}
  await refreshModels(); await poll(); modelSelect.disabled=false;
};
refreshModels().catch(error=>{st.textContent=error.message;});

async function loadSamplers(){
  const config=await (await fetch('/api/config')).json();
  for(const key of samplerKeys) document.getElementById('sample-'+key).value=config.sampling[key];
}
samplerToggle.onclick=async()=>{
  samplerPanel.hidden=!samplerPanel.hidden;
  if(!samplerPanel.hidden) await loadSamplers();
};
samplerSave.onclick=async()=>{
  samplerSave.disabled=true; samplerNote.textContent='saving';
  try{
    const config=await (await fetch('/api/config')).json();
    for(const key of samplerKeys){
      const input=document.getElementById('sample-'+key);
      config.sampling[key]=(key==='top_k'||key==='max_tokens')?parseInt(input.value,10):parseFloat(input.value);
    }
    const response=await fetch('/api/config',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(config)});
    if(!response.ok){const data=await response.json();throw new Error(data.detail||'save failed');}
    samplerNote.textContent='applied';
  }catch(error){samplerNote.textContent=error.message;}
  samplerSave.disabled=false;
};
airgapBox.onchange=async()=>{
  airgapBox.disabled=true;
  try{
    const config=await (await fetch('/api/config')).json();
    config.ui.airgap=airgapBox.checked;
    const response=await fetch('/api/config',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(config)});
    if(!response.ok){const data=await response.json();throw new Error(data.detail||'airgap update failed');}
  }catch(error){st.textContent=error.message;}
  await poll(); airgapBox.disabled=false;
};

function bubble(cls,text){
  const d=document.createElement('div'); d.className='msg '+cls;
  d.textContent=text; log.appendChild(d); log.scrollTop=log.scrollHeight; return d;
}

async function send(){
  const text=inp.value.trim(); if(!text||busy) return;
  busy=true; go.disabled=true; inp.value='';
  bubble('u',text); hist.push({role:'user',content:text});
  const out=bubble('a','');
  const raw=document.createElement('div'); out.appendChild(raw);
  let acc='', done=false;

  const btn=document.createElement('button');
  btn.className='copy'; btn.textContent='copy';
  btn.onclick=()=>{navigator.clipboard.writeText(acc); btn.textContent='copied';
                   setTimeout(()=>btn.textContent='copy',1200);};
  out.appendChild(btn);

  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:hist,think:thinkBox.checked})});
    if(!r.ok){ const t=await r.text(); let m=t; try{ m=JSON.parse(t).detail; }catch(e){} throw new Error(m); }
    const rd=r.body.getReader(), dec=new TextDecoder();
    for(;;){
      const {done:d,value}=await rd.read(); if(d) break;
      for(const line of dec.decode(value,{stream:true}).split('\n')){
        if(!line.startsWith('data:')) continue;
        const p=line.slice(5).trim(); if(p==='[DONE]') continue;
        try{ const j=JSON.parse(p);
          if(j.nox){
            const e=j.nox;
            if(e.tool){
              const t=document.createElement('div');
              t.className='think';
              t.textContent='▸ '+e.tool+' '+JSON.stringify(e.args).slice(0,160);
              out.insertBefore(t,btn);
            } else if(e.tool_result){
              const t=document.createElement('div');
              t.className='think';
              t.style.color=e.ok?'#00d4aa88':'#ff6b6b99';
              t.textContent=(e.ok?'✓ ':'✗ ')+e.tool_result.slice(0,200);
              out.insertBefore(t,btn);
            }
            log.scrollTop=log.scrollHeight;
            continue;
          }
          const t=j.choices?.[0]?.delta?.content||''; if(t){acc+=t;raw.textContent=acc;log.scrollTop=log.scrollHeight;}
        }catch(e){}
      }
    }
    done=true;
    const parsed=splitThinking(acc);
    out.removeChild(raw);
    if(!parsed){ const b=document.createElement('div'); b.innerHTML=md(acc); out.insertBefore(b,btn); }
    else{
      const det=document.createElement('details');
      det.innerHTML='<summary>thinking</summary>';
      const tp=document.createElement('div'); tp.className='think'; tp.textContent=parsed.thinking;
      det.appendChild(tp); out.insertBefore(det,btn);
      const b=document.createElement('div'); b.innerHTML=md(parsed.answer);
      out.insertBefore(b,btn);
    }
    hist.push({role:'assistant',content:acc});
  }catch(e){ raw.textContent='[error] '+e.message; }
  busy=false; go.disabled=false; inp.focus(); log.scrollTop=log.scrollHeight;
}
go.onclick=send;
inp.onkeydown=e=>{
  if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); }
};
document.getElementById('reset').onclick=e=>{e.preventDefault();hist=[];log.innerHTML='';inp.focus();};
inp.focus();
</script></body></html>
